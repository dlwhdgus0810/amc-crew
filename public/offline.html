<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You’re offline</title>
    <!-- 오프라인에 보여줄 화면이라 외부 파일에 기대지 않고 전부 인라인으로 둔다 -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 32px;
        background: #ffffff;
        color: #101010;
        font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Malgun Gothic', sans-serif;
        line-height: 1.55;
      }
      .dots { display: grid; grid-template-columns: repeat(2, 44px); gap: 14px; margin-bottom: 40px; position: relative; width: 102px; }
      .dot { width: 44px; height: 44px; border-radius: 999px; }
      .center { position: absolute; left: 29px; top: 29px; }
      h1 { font-size: clamp(32px, 9vw, 56px); font-weight: 600; letter-spacing: -0.04em; line-height: 1.02; margin: 0 0 14px; }
      p { color: #a5a39b; font-size: 16.5px; font-weight: 500; margin: 0 0 36px; max-width: 30em; }
      button {
        background: transparent; color: #101010;
        border: none; border-bottom: 1.5px solid #101010;
        padding: 3px 1px; font-size: 15px; font-weight: 600;
        font-family: inherit; cursor: pointer;
      }
      button:hover { opacity: 0.55; }
    </style>
  </head>
  <body>
    <div class="dots" aria-hidden="true">
      <span class="dot" style="background: #002fa7"></span>
      <span class="dot" style="background: #e8380d"></span>
      <span class="dot" style="background: #008542"></span>
      <span class="dot" style="background: #e9a300"></span>
      <span class="dot center" style="background: #5b2a86"></span>
    </div>
    <!-- 정적 파일이라 사용자 언어를 알 수 없다 → 저장된 locale 쿠키로 문구를 고른다 (없으면 한국어) -->
    <h1 id="t">연결이 끊겼어요.</h1>
    <p id="d">인터넷에 연결되면 모임 목록을 다시 불러올게요.</p>
    <button id="r" onclick="location.reload()">다시 시도 →</button>
    <script>
      if (/(^|;\s*)locale=en(;|$)/.test(document.cookie)) {
        document.documentElement.lang = 'en';
        document.getElementById('t').textContent = 'You’re offline.';
        document.getElementById('d').textContent = 'We’ll load your meetups again once you’re back online.';
        document.getElementById('r').textContent = 'Try again →';
      }
    </script>
  </body>
</html>
